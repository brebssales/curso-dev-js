//EXERCICIO 3

function celsiusParaFahrenheit(temperaturaCelsius) {
    const fahrenheit = (temperaturaCelsius * 9/5) + 32;
    return fahrenheit.toFixed(1);  // Formata para uma casa decimal
}
console.log(celsiusParaFahrenheit(0));    // Saída: 32.0
console.log(celsiusParaFahrenheit(25));   // Saída: 77.0
console.log(celsiusParaFahrenheit(100));  // Saída: 212.0
